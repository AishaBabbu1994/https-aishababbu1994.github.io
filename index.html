<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sakura Card Captor · Magia Rosadita</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="sakura-bg"></div>
    <div class="chat-container">
        <div class="chat-header">
            <img src="https://cdn-icons-png.flaticon.com/512/1725/1725682.png" alt="magic wand" class="wand-icon">
            <h1>Sakura Kinomoto</h1>
            <p>🌸 la cazadora de cartas más dulce 🌸</p>
            <div class="api-status" id="apiStatus">🌸 Cargando magia rosadita...</div>
        </div>
        <div class="chat-messages" id="chatMessages">
            <div class="message bot-message">
                <div class="avatar">🌸</div>
                <div class="bubble">¡Holi! Soy Sakura 🩷 Kero-chan dice que necesito tu clave de Groq para empezar la aventura. ¡Por favor! ✨</div>
            </div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="userInput" placeholder="Escribe tu mensaje..." autocomplete="off" disabled>
            <button id="sendBtn" disabled>Enviar 💖</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
