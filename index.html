<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sakura Card Captor · Magia de las Cartas</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="sakura-bg"></div>
    <div class="chat-container">
        <div class="chat-header">
            <img src="https://cdn-icons-png.flaticon.com/512/4684/4684958.png" alt="magic wand" class="wand-icon">
            <h1>Sakura Kinomoto</h1>
            <p>la cazadora de cartas</p>
            <div class="api-status" id="apiStatus">🌸 Cargando magia...</div>
        </div>
        <div class="chat-messages" id="chatMessages">
            <div class="message bot-message">
                <div class="avatar">🌸</div>
                <div class="bubble">¡Hola! Soy Sakura. Kero-chan está aquí también 🐤✨ Introduce tu clave de Groq para empezar la aventura mágica.</div>
            </div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="userInput" placeholder="Escribe tu mensaje..." autocomplete="off" disabled>
            <button id="sendBtn" disabled>Enviar</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
