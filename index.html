<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot Sakura Card Captor</title>
    <style>
        body { 
            font-family: 'Arial', sans-serif; 
            background-color: #ffe6f2; 
            color: #d63384; 
            padding: 20px;
            margin: 0;
            position: relative;
            min-height: 100vh;
        }
        
        /* Background sticker de Sakura */
        .sakura-sticker {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 200px;
            height: auto;
            opacity: 0.15;
            z-index: 0;
            pointer-events: none;
            transform: rotate(-15deg);
        }
        
        .container { 
            max-width: 600px; 
            margin: 0 auto; 
            background: white; 
            padding: 20px; 
            border-radius: 15px; 
            border: 3px solid #ff99cc;
            position: relative;
            z-index: 1;
        }
        .api-bar { margin-bottom: 15px; text-align: center; }
        .api-bar input { width: 80%; padding: 10px; border: 2px solid #ff99cc; border-radius: 8px; outline: none; }
        .chat-box { height: 300px; overflow-y: auto; border: 2px solid #ff99cc; border-radius: 10px; padding: 10px; margin-bottom: 10px; background: #fff0f5; }
        .message { margin: 8px 0; padding: 10px; border-radius: 10px; line-height: 1.4; }
        .sakura { background: #ffccdd; text-align: right; margin-left: 20%; }
        .user { background: #e6f2ff; text-align: left; margin-right: 20%; }
        .input-area { display: flex; gap: 8px; }
        .input-area input { flex: 1; padding: 10px; border: 2px solid #ff99cc; border-radius: 8px; outline: none; }
        button { padding: 10px 20px; background: #ff66b2; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        button:hover { background: #ff3399; }
    </style>
</head>
<body>
    <!-- Sticker de Sakura como background -->
    <img src="sakura-sticker.png" alt="Sakura" class="sakura-sticker">
    
    <div class="container">
        <h2 style="text-align: center;">🌸 Chatbot Sakura 🌸</h2>
        
        <!-- Barra para la API Key de Groq -->
        <div class="api-bar">
            <input type="password" id="apiKey" placeholder="🔑 Pega aquí tu API Key de Groq">
        </div>

        <div class="chat-box" id="chatBox">
            <div class="message sakura">¡Holi! 🌸 Soy Sakura. ¿Quieres que usemos las Cartas Clow o prefieres hablar de Tomoeda? ✨ ¡Pregúntame lo que quieras!</div>
        </div>

        <div class="input-area">
            <input type="text" id="userInput" placeholder="Escribe tu mensaje aquí...">
            <button onclick="sendMessage()">Enviar 🌟</button>
        </div>
    </div>

    <script>
        async function sendMessage() {
            const apiKey = document.getElementById('apiKey').value;
            const userInput = document.getElementById('userInput').value;
            const chatBox = document.getElementById('chatBox');

            if (!apiKey) { alert('Por favor, añade tu API Key de Groq primero. 🔑'); return; }
            if (!userInput.trim()) return;

            chatBox.innerHTML += `<div class="message user">Tú: ${userInput}</div>`;
            document.getElementById('userInput').value = '';

            chatBox.innerHTML += `<div class="message sakura" id="loading">Sakura está pensando... ✨</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${apiKey}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: "llama3-8b-8192",
                        messages: [
                            { role: "system", content: "Eres Sakura Kinomoto de Cardcaptor Sakura. Eres amable, energética y usas emojis de flores 🌸 y estrellas ✨. Responde de forma breve, clara y alegre." },
                            { role: "user", content: userInput }
                        ]
                    })
                });

                const data = await response.json();
                document.getElementById('loading').remove();

                if (data.choices && data.choices[0]) {
                    const reply = data.choices[0].message.content;
                    chatBox.innerHTML += `<div class="message sakura">Sakura: ${reply}</div>`;
                } else {
                    chatBox.innerHTML += `<div class="message sakura">Ups, algo salió mal con la magia. ✨ (Revisa tu API Key)</div>`;
                }
            } catch (error) {
                document.getElementById('loading').remove();
                chatBox.innerHTML += `<div class="message sakura">Error de conexión. ✨</div>`;
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
