<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sakura Card Captor · Magia Rosadita</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #ffeef8 0%, #ffd6e7 50%, #ffcce0 100%);
            position: relative;
            overflow-x: hidden;
        }

        /* Fondo de pétalos animados */
        .sakura-bg {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 0;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(255, 182, 193, 0.4) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(255, 192, 203, 0.3) 0%, transparent 50%);
        }

        .petal {
            position: fixed;
            top: -10%;
            color: rgba(255, 182, 193, 0.6);
            animation: fall linear infinite;
            z-index: 1;
        }

        @keyframes fall {
            to {
                transform: translateY(110vh) rotate(360deg);
            }
        }

        /* Contenedor principal */
        .chat-container {
            max-width: 900px;
            margin: 2rem auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(255, 105, 180, 0.3);
            overflow: hidden;
            position: relative;
            z-index: 10;
            border: 3px solid rgba(255, 182, 193, 0.5);
        }

        /* Header con imagen de Sakura */
        .chat-header {
            background: linear-gradient(135deg, #ffb6c1 0%, #ff69b4 100%);
            padding: 2rem;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .chat-header::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -10%;
            width: 300px;
            height: 300px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
        }

        .sakura-image-container {
            position: relative;
            display: inline-block;
            margin-bottom: 1rem;
        }

        .sakura-main-image {
            width: 200px;
            height: 200px;
            object-fit: cover;
            border-radius: 50%;
            border: 5px solid white;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        .magic-wand {
            position: absolute;
            bottom: 10px;
            right: 10px;
            font-size: 2.5rem;
            animation: sparkle 2s infinite;
        }

        @keyframes sparkle {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.2); }
        }

        .chat-header h1 {
            color: white;
            font-size: 2rem;
            font-weight: 700;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
            margin-bottom: 0.5rem;
        }

        .chat-header p {
            color: rgba(255, 255, 255, 0.95);
            font-size: 1.1rem;
            font-weight: 600;
        }

        .api-status {
            margin-top: 1rem;
            padding: 0.5rem 1rem;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            color: white;
            display: inline-block;
            font-weight: 600;
            backdrop-filter: blur(10px);
        }

        /* Mensajes */
        .chat-messages {
            height: 400px;
            overflow-y: auto;
            padding: 2rem;
            background: linear-gradient(to bottom, rgba(255, 240, 245, 0.5), rgba(255, 255, 255, 0.8));
        }

        .message {
            display: flex;
            margin-bottom: 1.5rem;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.bot-message {
            justify-content: flex-start;
        }

        .message.user-message {
            justify-content: flex-end;
        }

        .avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            margin-right: 1rem;
            background: linear-gradient(135deg, #ffb6c1, #ff69b4);
            border: 3px solid white;
            box-shadow: 0 4px 10px rgba(255, 105, 180, 0.3);
        }

        .user-message .avatar {
            background: linear-gradient(135deg, #87ceeb, #4682b4);
            order: 2;
            margin-right: 0;
            margin-left: 1rem;
        }

        .bubble {
            max-width: 70%;
            padding: 1rem 1.5rem;
            border-radius: 20px;
            font-size: 1rem;
            line-height: 1.5;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .bot-message .bubble {
            background: white;
            color: #4a4a4a;
            border-bottom-left-radius: 5px;
            border: 2px solid rgba(255, 182, 193, 0.5);
        }

        .user-message .bubble {
            background: linear-gradient(135deg, #ff69b4, #ff1493);
            color: white;
            border-bottom-right-radius: 5px;
        }

        /* Área de input */
        .chat-input-area {
            padding: 1.5rem 2rem;
            background: rgba(255, 240, 245, 0.8);
            border-top: 2px solid rgba(255, 182, 193, 0.5);
            display: flex;
            gap: 1rem;
        }

        #userInput {
            flex: 1;
            padding: 1rem 1.5rem;
            border: 3px solid rgba(255, 182, 193, 0.6);
            border-radius: 25px;
            font-family: 'Quicksand', sans-serif;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s;
            background: white;
        }

        #userInput:focus {
            border-color: #ff69b4;
            box-shadow: 0 0 20px rgba(255, 105, 180, 0.3);
        }

        #userInput:disabled {
            background: rgba(255, 255, 255, 0.5);
            cursor: not-allowed;
        }

        #sendBtn {
            padding: 1rem 2rem;
            background: linear-gradient(135deg, #ff69b4, #ff1493);
            color: white;
            border: none;
            border-radius: 25px;
            font-family: 'Quicksand', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(255, 105, 180, 0.4);
        }

        #sendBtn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 105, 180, 0.6);
        }

        #sendBtn:disabled {
            background: #ccc;
            cursor: not-allowed;
            box-shadow: none;
        }

        /* Scrollbar personalizada */
        .chat-messages::-webkit-scrollbar {
            width: 8px;
        }

        .chat-messages::-webkit-scrollbar-track {
            background: rgba(255, 240, 245, 0.5);
            border-radius: 10px;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #ffb6c1, #ff69b4);
            border-radius: 10px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .chat-container {
                margin: 1rem;
                border-radius: 20px;
            }

            .sakura-main-image {
                width: 150px;
                height: 150px;
            }

            .chat-header h1 {
                font-size: 1.5rem;
            }

            .bubble {
                max-width: 85%;
            }
        }

        /* Efecto de brillo mágico */
        .magic-glow {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.4) 0%, transparent 70%);
            pointer-events: none;
            animation: glow 3s ease-in-out infinite;
        }

        @keyframes glow {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="sakura-bg" id="sakuraBg"></div>
    
    <div class="chat-container">
        <div class="chat-header">
            <div class="magic-glow"></div>
            <div class="sakura-image-container">
                <!-- Reemplaza esto con la ruta de tu imagen -->
                <img src="sakura-image.png" alt="Sakura Kinomoto" class="sakura-main-image">
                <span class="magic-wand">✨</span>
            </div>
            <h1>Sakura Kinomoto</h1>
            <p>🌸 la cazadora de cartas más dulce 🌸</p>
            <div class="api-status" id="apiStatus">🌸 Cargando magia rosadita...</div>
        </div>

        <div class="chat-messages" id="chatMessages">
            <div class="message bot-message">
                <div class="avatar">🌸</div>
                <div class="bubble">¡Holi! Soy Sakura 🩷 Kero-chan dice que necesito tu clave de Groq para empezar la aventura. ¡Por favor! ✨</div>
            </div>
        </div>

        <div class="chat-input-area">
            <input type="text" id="userInput" placeholder="Escribe tu mensaje mágico..." autocomplete="off" disabled>
            <button id="sendBtn" disabled>Enviar 💖</button>
        </div>
    </div>

    <script>
        // Crear pétalos cayendo
        function createPetals() {
            const container = document.getElementById('sakuraBg');
            const petalSymbols = ['🌸', '', '', '✿'];
            
            setInterval(() => {
                const petal = document.createElement('div');
                petal.className = 'petal';
                petal.textContent = petalSymbols[Math.floor(Math.random() * petalSymbols.length)];
                petal.style.left = Math.random() * 100 + '%';
                petal.style.fontSize = (Math.random() * 20 + 10) + 'px';
                petal.style.animationDuration = (Math.random() * 5 + 5) + 's';
                container.appendChild(petal);
                
                setTimeout(() => petal.remove(), 10000);
            }, 1000);
        }

        createPetals();

        // Tu lógica de JavaScript existente va aquí
        const chatMessages = document.getElementById('chatMessages');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const apiStatus = document.getElementById('apiStatus');

        // Ejemplo de función para agregar mensajes
        function addMessage(text, isUser = false) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user-message' : 'bot-message'}`;
            
            const avatar = document.createElement('div');
            avatar.className = 'avatar';
            avatar.textContent = isUser ? '👤' : '🌸';
            
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            bubble.textContent = text;
            
            messageDiv.appendChild(avatar);
            messageDiv.appendChild(bubble);
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // Simular carga de API
        setTimeout(() => {
            apiStatus.textContent = '✨ ¡Magia lista!';
            userInput.disabled = false;
            sendBtn.disabled = false;
            userInput.placeholder = 'Escribe tu mensaje mágico...';
        }, 2000);
    </script>
</body>
</html>
